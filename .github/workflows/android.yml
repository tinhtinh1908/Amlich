name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test lunar calendar and holidays
        run: |
          mkdir -p build/calendar-tests
          javac -encoding UTF-8 -d build/calendar-tests src/com/dtinh/lichviet/LunarCalendar.java src/com/dtinh/lichviet/HolidayUtil.java tests/LunarCalendarTest.java
          java -cp build/calendar-tests LunarCalendarTest
      - name: Build APK and run Android lint
        run: bash gradlew --no-daemon assembleDebug lintDebug
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: AmLichViet-2.2.0-vc43-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: build/reports/lint-results-debug.*
          if-no-files-found: ignore
