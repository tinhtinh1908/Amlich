name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and platform tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools emulator platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run native calendar and animation regression checks
        run: python3 tools/run_tests.py
      - name: Build debug and release APKs, then run Android lint
        id: android-build
        run: bash gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify navigation on Android and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r build/outputs/apk/debug/*.apk
            python3 tools/smoke_ui.py
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-screenshots
          path: build/ui/
          if-no-files-found: ignore
      - name: Upload installable test APK
        if: ${{ !cancelled() && steps.android-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: AmLichViet-2.7-vc50-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        if: ${{ !cancelled() && steps.android-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: AmLichViet-2.7-vc50-release-unsigned
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: build/reports/lint-results-debug.*
          if-no-files-found: ignore
