name: Build Liquid Glass APK
on:
  push:
    branches: [codex-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify and extract clean source
        run: |
          cat source-bundle.part-* > source-bundle-fixed.zip
          echo "58b98f0da687f9acc46339835f93732288d65ab4227001afcc8f1ac9f186736d  source-bundle-fixed.zip" | sha256sum -c -
          mkdir app
          unzip -q source-bundle-fixed.zip -d app
          chmod +x app/gradlew
      - name: Build release APK
        working-directory: app
        run: ./gradlew --no-daemon clean lintRelease assembleRelease
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: AmLichViet-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
