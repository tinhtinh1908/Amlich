name: Build Xiaomi Weather Replacement
on:
  push:
    branches: [weather-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify and extract source
        run: |
          cat source-bundle.part-* > source-bundle-fixed.zip
          echo "09b911bfee4498d813eb721ab678b99b4364465ff508d3a1361eaddfa12bf79a  source-bundle-fixed.zip" | sha256sum -c -
          mkdir app
          unzip -q source-bundle-fixed.zip -d app
          chmod +x app/gradlew
      - name: Compile release APK
        working-directory: app
        run: ./gradlew --no-daemon clean assembleRelease
      - name: Run lint
        if: always()
        working-directory: app
        run: ./gradlew --no-daemon lintRelease || true
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Weather-Replacement-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
