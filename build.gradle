plugins {
    id 'com.android.application' version '9.2.1'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
}

android {
    namespace 'com.dtinh.lichviet'
    compileSdk { version = release(37) { minorApiLevel = 2 } }

    defaultConfig {
        applicationId 'com.dtinh.lichviet'
        minSdk 30
        targetSdk 34
        versionCode 49
        versionName '2.6'
        multiDexEnabled false
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            kotlin.directories.add('src')
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        test.java.srcDirs = ['tests']
    }

    buildTypes {
        debug {
            applicationIdSuffix = providers.gradleProperty('amlichAdbSuffix').getOrElse('')
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures { compose true; resValues true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/**', '**/*.kotlin_metadata']
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

dependencies {
    implementation 'top.yukonga.miuix.kmp:miuix-glass-android:0.9.5-beta01'
    implementation 'androidx.activity:activity-compose:1.10.1'
}
